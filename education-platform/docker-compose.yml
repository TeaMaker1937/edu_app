services:
  postgres:
    image: postgres:18-alpine
    container_name: education-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: education_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d education_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - education-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: education-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: education_platform
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: "change-me-please-this-should-be-at-least-32-bytes-long-256-bit-key-for-hs256"
      JWT_EXPIRATION: 86400000
    ports:
      - "8080:8080"
    networks:
      - education-net

volumes:
  postgres-data:

networks:
  education-net:
    driver: bridge