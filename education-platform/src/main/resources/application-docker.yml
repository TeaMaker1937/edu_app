spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:education_platform}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:change-me-please-this-should-be-at-least-32-bytes-long-256-bit-key-for-hs256}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    root: INFO
    edu.platform: DEBUG

info:
  app:
    name: Education Platform
    description: REST API образовательной платформы
    version: 0.0.1-SNAPSHOT

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true