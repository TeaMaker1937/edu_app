spring:
  application:
    name: education-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/education_platform
    username: postgres
    password: qwerty
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
