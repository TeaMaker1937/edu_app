server:
  port: 8082
  shutdown: graceful    # п.9 — корректное завершение

spring:
  application:
    name: enrollment-service
  lifecycle:
    timeout-per-shutdown-phase: 20s   # ждём до 20 сек завершения текущего запроса
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/education_platform}
    username: ${SPRING_R2DBC_USERNAME:postgres}
    password: ${SPRING_R2DBC_PASSWORD:qwerty}

catalog:
  base-url: ${CATALOG_BASE_URL:http://localhost:8081}
  timeout: ${CATALOG_TIMEOUT:3s}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    root: INFO
    edu.platform: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus, env
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

management.tracing:
  enabled: false