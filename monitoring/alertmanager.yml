route:
  receiver: default
  group_by: [alertname]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: default
    webhook_configs:
      # Заглушка: реальную доставку не делаем, алерт нам нужен только в UI.
      - url: 'http://enrollment:8082/__alerts'
        send_resolved: true