global:
  scrape_interval: 5s        # частый скрейп — чтобы алерт срабатывал быстро
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'enrollment'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['enrollment:8082']

  - job_name: 'catalog'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['catalog:8081']

  - job_name: 'platform'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['platform:8080']